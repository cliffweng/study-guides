title: Study Guides
description: >-
  A directory of Cliff Weng study guides for Penn builders — engineering,
  finance, and founders — and for anyone else who wants the same pages.
baseurl: "/study-guides"
url: "https://cliffweng.github.io"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_insensitive
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/cliffweng/study-guides"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026. Distributed under the MIT License."

back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTRIBUTING.md
